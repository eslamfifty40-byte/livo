name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            appname: Livo
            appid: com.livo.client
            icon: livo.icon.png
            mode: customer
          - name: admin #
            appname: Livo Admin #
            appid: com.livo.admin #
            icon: livoadmin.icon.png #
            mode: admin #
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - run: npm install --legacy-peer-deps
      - run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Build web
        run: npm run build
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - name: Build APK
        run: |
          echo '{"appId":"${{ matrix.appid }}","appName":"${{ matrix.appname }}","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p android/app/src/main/res/mipmap-$1
            for n in ic_launcher ic_launcher_round; do
              convert "${{ matrix.icon }}" -resize $2x$2 -gravity center -background none -extent $2x$2 android/app/src/main/res/mipmap-$1/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.png
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../livo-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: livo-${{ matrix.name }}
          path: livo-${{ matrix.name }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" out/*.apk --repo "${{ github.repository }}" --title "Build ${{ github.run_number }}"
