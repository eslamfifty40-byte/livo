name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            appname: Livo
            appid: com.livo.client
            icon: livo.icon.png
            mode: customer
          - name: admin
            appname: Livo Admin
            appid: com.livo.admin
            icon: livoadmin.icon.png
            mode: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-firebase/authentication@6
      - name: Build web
        run: |
          if [ "$VITE_APP_MODE" = "admin" ]; then cp admin.html index.html; fi
          npx tsc --noEmit
          npm run build
          rm -rf dist/assets/aistudio
          find dist/assets/livo -name 'Screenshot_*' -delete || true
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build APK
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          rm -rf android
          rm -f capacitor.config.ts
          printf '{"appId":"%s","appName":"%s","webDir":"dist","server":{"androidScheme":"https"},"android":{"allowMixedContent":false,"captureInput":true},"plugins":{"FirebaseAuthentication":{"skipNativeAuth":true,"providers":["google.com"]}}}\n' "${{ matrix.appid }}" "${{ matrix.appname }}" > capacitor.config.json
          npx cap add android
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = [
            "android.permission.RECORD_AUDIO",
            "android.permission.CAMERA",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.READ_MEDIA_IMAGES"
          ].filter(perm => !xml.includes(perm))
           .map(perm => `    <uses-permission android:name="${perm}" />`)
           .join("\n");
          if (perms) {
            xml = xml.replace("<application", perms + "\n    <application");
          }
          if (/android:allowBackup="[^"]*"/.test(xml)) {
            xml = xml.replace(/android:allowBackup="[^"]*"/, 'android:allowBackup="false"');
          } else {
            xml = xml.replace("<application", '<application\n        android:allowBackup="false"');
          }
          if (!xml.includes("android:usesCleartextTraffic=")) {
            xml = xml.replace("<application", '<application\n        android:usesCleartextTraffic="false"');
          }
          if (!xml.includes("android:networkSecurityConfig=")) {
            xml = xml.replace("<application", '<application\n        android:networkSecurityConfig="@xml/network_security_config"');
          }
          fs.writeFileSync(p, xml);

          const resXmlDir = "android/app/src/main/res/xml";
          fs.mkdirSync(resXmlDir, { recursive: true });
          const netSecConfig = `<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n    <base-config cleartextTrafficPermitted="false">\n        <trust-anchors>\n            <certificates src="system" />\n        </trust-anchors>\n    </base-config>\n</network-security-config>\n`;
          fs.writeFileSync(path.join(resXmlDir, "network_security_config.xml"), netSecConfig);

          const proguardPath = "android/app/proguard-rules.pro";
          const extraProguard = `\n# LIVO Release Hardening\n-keep class com.getcapacitor.** { *; }\n-keep class io.capawesome.** { *; }\n-keep class com.google.android.gms.** { *; }\n-keep class com.google.firebase.** { *; }\n-dontwarn okhttp3.**\n-assumenosideeffects class android.util.Log {\n    public static int v(...);\n    public static int d(...);\n}\n`;
          const prevProguard = fs.existsSync(proguardPath) ? fs.readFileSync(proguardPath, "utf8") : "";
          if (!prevProguard.includes("LIVO Release Hardening")) {
            fs.writeFileSync(proguardPath, prevProguard + extraProguard);
          }
          EOF
          IM_CMD=$(command -v magick || command -v convert)
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p android/app/src/main/res/mipmap-$1
            for n in ic_launcher ic_launcher_round; do
              "$IM_CMD" "${{ matrix.icon }}" -resize $2x$2 -gravity center -background none -extent $2x$2 android/app/src/main/res/mipmap-$1/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi* || true
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.png android/app/src/main/res/mipmap-*/ic_launcher_background.png || true
          GS=$(ls google-services/*${{ matrix.name }}*.json 2>/dev/null | head -1); [ -n "$GS" ] || GS=$(ls google-services/*.json | head -1); echo "google-services: $GS"; cp "$GS" android/app/google-services.json
          mkdir -p ~/.android; cp livo-debug.keystore ~/.android/debug.keystore
          npx cap sync android
          sed -i '/^dependencies {/a implementation "com.google.android.gms:play-services-auth:21.2.0"' android/app/build.gradle
          grep -q rgcfaIncludeGoogle android/variables.gradle || sed -i '/^ext {/a rgcfaIncludeGoogle = true' android/variables.gradle
          grep -n play-services-auth android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../livo-${{ matrix.name }}.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: livo-${{ matrix.name }}-apk
          path: livo-${{ matrix.name }}.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: livo-*-apk
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          ls -lh livo-client.apk livo-admin.apk
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$TAG" --repo "${{ github.repository }}" --title "LIVO Build ${{ github.run_number }}" --notes "Client (livo-client.apk) + Admin (livo-admin.apk)"
          gh release upload "$TAG" livo-client.apk livo-admin.apk --repo "${{ github.repository }}" --clobber
          echo "### LIVO APKs Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Client APK:** https://github.com/${{ github.repository }}/releases/download/${TAG}/livo-client.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Admin APK:** https://github.com/${{ github.repository }}/releases/download/${TAG}/livo-admin.apk" >> "$GITHUB_STEP_SUMMARY"
